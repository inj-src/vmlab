# Compressed swap in memory, used before /swap.img on the system disk (higher priority).
# Installed by host/install-zram.sh. A VM takes 8 GB of the 23 GB; host pages pushed out
# while it runs are compressed here (about 3:1 with zstd) instead of written to the disk.
[zram0]
zram-size = min(ram / 2, 12288)
compression-algorithm = zstd
swap-priority = 100
