<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- the Windows 11 logo, four equal blue squares, on a light tile of the macOS icon's shape:
       without a tile the squares sat straight on the dark dock and read as a dark-mode logo -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e3edf8"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4cc2ff"/><stop offset=".5" stop-color="#1490e8"/><stop offset="1" stop-color="#0464d8"/>
    </linearGradient>
  </defs>
  <rect x="12" y="12" width="232" height="232" rx="56" fill="url(#tile)"/>
  <rect x="12.5" y="12.5" width="231" height="231" rx="55.5" fill="none" stroke="#000000" stroke-opacity=".10"/>
  <g fill="url(#g)">
    <rect x="60" y="60" width="64" height="64" rx="3"/><rect x="132" y="60" width="64" height="64" rx="3"/>
    <rect x="60" y="132" width="64" height="64" rx="3"/><rect x="132" y="132" width="64" height="64" rx="3"/>
  </g>
</svg>
