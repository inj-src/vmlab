<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- the Windows VM's tray icon (vm-tray): the four squares of its app icon, vmlab-win11-light.svg,
       flat and without the tile (the user's pick). Plain shapes, so the tray can recolour them for
       the panel (a symbolic icon) -->
  <g fill="#2e3436">
    <rect x="20" y="20" width="104" height="104" rx="6"/><rect x="136" y="20" width="104" height="104" rx="6"/>
    <rect x="20" y="136" width="104" height="104" rx="6"/><rect x="136" y="136" width="104" height="104" rx="6"/>
  </g>
</svg>
