[package]
name = "vmlab"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "The lab's VMs and their saved states, in one window."

[dependencies]
rune = { path = "rune/crates/rune" }
rune-kit = { path = "rune/crates/rune-kit" }
rune-theme-opencode = { path = "rune/themes/opencode" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Rune builds against its own patched copies of these crates (rune/AGENTS.md, "Layout").
[patch.crates-io]
wgpu-hal = { path = "rune/vendor/wgpu-hal" }
naga = { path = "rune/vendor/naga" }
winit = { path = "rune/vendor/winit" }
sctk-adwaita = { path = "rune/vendor/sctk-adwaita" }
parley_engine = { path = "rune/vendor/parley_engine" }
accesskit_windows = { path = "rune/vendor/accesskit_windows" }
accesskit_atspi_common = { path = "rune/vendor/accesskit_atspi_common" }
accesskit_macos = { path = "rune/vendor/accesskit_macos" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 16
incremental = true
