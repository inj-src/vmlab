<!doctype html>
<html><head><meta charset="utf-8"><title>Bench Form</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self'">
<style>
 body{font:15px system-ui,sans-serif;margin:28px;max-width:560px}
 label{display:block;margin:14px 0 4px} input[type=text],select{width:100%;padding:6px;font:inherit}
 .row{display:flex;gap:10px;margin-top:20px} button{padding:8px 16px;font:inherit}
 #status{margin-top:18px;font-weight:600}
</style></head>
<body>
 <h1>Bench Form</h1>
 <label for="name">Full name</label><input id="name" type="text" aria-label="Full name">
 <label for="color">Favourite colour</label>
 <select id="color" aria-label="Favourite colour">
  <option value="">Choose…</option><option>Red</option><option>Green</option><option>Blue</option><option>Purple</option>
 </select>
 <label><input id="agree" type="checkbox"> I agree to the terms</label>
 <div class="row">
  <button id="submit">Submit</button>
  <button id="export">Export report…</button>
 </div>
 <div id="status" role="status">Ready</div>
 <script src="renderer.js"></script>
</body></html>
