[package]
name = "vmlab-mcp"
version = "0.1.0"
edition = "2024"
description = "stdio MCP server that drives the vmlab Windows and macOS VMs through Cua Driver"
publish = false

[dependencies]
rmcp = { version = "3.9", features = ["server", "client", "transport-io", "transport-child-process"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
